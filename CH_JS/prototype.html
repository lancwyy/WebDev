<!DOCTYPE html>
<html>

<head>
    <title>執行 JS</title>
</head>

<body>
    <h1>請打開瀏覽器的開發者工具（F12）看結果</h1>

    <!-- 引入你的獨立 JS 檔案 -->
    <script>
        // A：掛在 prototype
        function PersonA(name) {
            this.name = name;
        }
        PersonA.prototype.status = "尚未設定";
        PersonA.prototype.greet = function (status) {
            if (status !== undefined) {
                PersonA.prototype.status = status;
            }
            console.log(`Hi, I'm ${this.name}. Status: ${this.status}`);
        };

        // B：寫在 constructor 裡
        function PersonB(name) {
            this.name = name;
            this.status = "NOT SET";
            this.greet = function (status) {
                if (status !== undefined) {
                    this.status = status;
                }
                console.log(`Hi, I'm ${this.name}. Status: ${this.status}`);
            };
        }

        const a1 = new PersonA("Amy");
        const a2 = new PersonA("Bob");
        a1.greet("Happy");
        a2.greet();

        const b1 = new PersonB("Sharon");
        const b2 = new PersonB("Jessica");
        b1.greet("Happy");
        b2.greet();
    </script>
</body>

</html>
