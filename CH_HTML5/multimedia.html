<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }

        .box {
            margin-bottom: 30px;
            /* margin: 0 0 30px; */
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 700px;
        }

        img,
        video {
            max-width: 100%;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h2>Multimedia Example</h2>

    <div class="box">
        <h3>Image</h3>
        <img src="../images/statue.jpg" alt="Statue of Eagle">
        &nbsp;&nbsp;&nbsp;
        <img src="../images/sspiderman.jpeg" alt="Statue of Eagle">
    </div>

    <div class="box">
        <h3>Display Image by Picture Tag</h3>
        <picture>
            <source media="(min-width: 936px)" srcset="../images/ecg.jpg" type="image/jpeg">
            <source media="(min-width: 280px)" srcset="../images/ntoulogo.gif" type="image/gif">
            <img src="../images/statue.jpg" alt="Statue of Eagle">
        </picture>
        <!-- <p>Picture 1: Display Image by Picture Tag</p> -->
    </div>

    <figure class="box">
        <picture>
            <source media="(min-width: 936px)" srcset="../images/ecg.jpg" type="image/jpeg">
            <img src="../images/statue.jpg" alt="Statue of Eagle">
        </picture>
        <figcaption>Figure 1: Display Image by Figure Tag</figcaption>
    </figure>

    <div class="box">
        <h3>Audio</h3>
        <audio controls loop>
            <source src="https://www.ntou.edu.tw/NTOUweb/files/about/music_by_ntou.mp3#t=60" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>
    </div>

    <div class="box">
        <h3>Video</h3>
        <video controls poster="../images/ecg.jpg" width="640">
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4#t=5,10" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</body>

</html>
