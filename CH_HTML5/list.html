<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definition List Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        dl {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
        }
        dt {
            font-weight: bold;
            color: #0066cc;
            margin-top: 10px;
        }
        dd {
            margin-left: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>Simple Example of dl, dt, and dd</h2>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language is used to structure web pages.</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets are used to style the appearance of web pages.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript is used to add interactivity and dynamic behavior to web pages.</dd>
    </dl>
</body>
</html>
