<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <h2>Simple Example of Table Elements</h2>

    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th rowspan="2">Course</th>
                <th rowspan="2">Credits</th>
                <th colspan="2">Teacher</th>
            </tr>
            <tr>
                <th>Title</th>
                <th>Name</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML</td>
                <td>3</td>
                <td>Mr.</td>
                <td>Wang</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>2</td>
                <td>Ms.</td>
                <td>Lin</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Course Information</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
